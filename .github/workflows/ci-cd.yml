name: CI/CD

on:
  push:
    branches:
      - docker-ci-cd
      - develop

  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: habit_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d habit_tracker"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: github-actions-test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000

      POSTGRES_DB: habit_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

      TELEGRAM_BOT_TOKEN: test-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test

      - name: Run flake8
        run: flake8 config habits users --exclude=migrations

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker image build
        run: docker build -t habit-tracker:test .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/docker-ci-cd'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Test SSH connection
        run: |
          ssh \
            -p 443 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo 'SSH CONNECTION OK'"

      - name: Pack project
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.venv' \
            -czf /tmp/habit_tracker.tar.gz .

      - name: Upload project
        run: |
          scp \
            -P 443 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            /tmp/habit_tracker.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/habit_tracker.tar.gz"

      - name: Deploy application
        run: |
          ssh \
            -p 443 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "sudo mkdir -p /home/ubuntu/habit_tracker && \
             sudo tar --no-same-owner -xzf /tmp/habit_tracker.tar.gz -C /home/ubuntu/habit_tracker && \
             cd /home/ubuntu/habit_tracker && \
             sudo docker compose up -d --build && \
             sudo docker compose exec -T web python manage.py migrate && \
             rm -f /tmp/habit_tracker.tar.gz"
